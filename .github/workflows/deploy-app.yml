name: "Deploy — App"

# Disparo manual via "Use workflow from":
#   - Selecione uma TAG    → faz deploy daquela versão específica
#   - Selecione uma BRANCH → faz deploy da tag mais recente encontrada no repositório
#
# Imagem gerada: ghcr.io/{owner}/pelada-app:{version}

on:
  workflow_dispatch:

jobs:
  # ════════════════════════════════════════════════════════════════════════
  # JOB 1 - Resolver e validar a tag a partir do ref selecionado
  # ════════════════════════════════════════════════════════════════════════
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag:     ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolver tag
        id: resolve
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            echo "Ref é uma tag: ${TAG}"
          else
            TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
            if [ -z "$TAG" ]; then
              echo "::error::Nenhuma tag encontrada no repositório."
              exit 1
            fi
            echo "Branch '${{ github.ref_name }}' → tag mais recente: ${TAG}"
          fi

          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Formato inválido: '${TAG}'. Esperado: v{MAJOR}.{MINOR}.{PATCH}"
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  # ════════════════════════════════════════════════════════════════════════
  # JOB 2 - Build e Push da imagem runtime para o GHCR
  # ════════════════════════════════════════════════════════════════════════
  build-push:
    runs-on: ubuntu-latest
    needs: resolve
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout na tag resolvida
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Determinar image base
        id: image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "base=ghcr.io/${OWNER}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push — Runtime
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ steps.image.outputs.base }}/pelada-app:${{ needs.resolve.outputs.version }}
            ${{ steps.image.outputs.base }}/pelada-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        run: |
          BASE="${{ steps.image.outputs.base }}"
          VER="${{ needs.resolve.outputs.version }}"
          TAG="${{ needs.resolve.outputs.tag }}"
          {
            echo "## 🚀 Deploy — App"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| **Tag** | \`${TAG}\` |"
            echo "| **Versão** | \`${VER}\` |"
            echo ""
            echo "### Imagens publicadas"
            echo ""
            echo "| Imagem | Tag |"
            echo "|---|---|"
            echo "| \`${BASE}/pelada-app\` | \`${VER}\` |"
            echo "| \`${BASE}/pelada-app\` | \`latest\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ════════════════════════════════════════════════════════════════════════
  # JOB 3 - Acionar redeploy no Portainer
  # ════════════════════════════════════════════════════════════════════════
